name: 'build-test'

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone git repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint, build and test application
        run: npm run all
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Clone git repository
        uses: actions/checkout@v7.0.1
      # The action only accepts pull_request_target; override the event name to smoke-test it safely under pull_request.
      - name: Run action locally
        run: GITHUB_EVENT_NAME=pull_request_target node dist/index.js
        env:
          INPUT_GITHUBTOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PATTERN: .*example
          INPUT_TRUSTEDAUTHORS: xalvarez
          INPUT_ALLOWNEWFILES: 'false'
